<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick&amp;Stats – démo</title>
<link rel="icon" href="icon.svg">
<style>
/* Démo qui se joue toute seule : la vraie appli (index.html?demo, données à part) dans un cadre
   de tablette, un doigt qui touche les boutons et des sous-titres. */
:root{
  --bg:#0f1a20; --panel:#16242c; --fg:#eef3f1; --muted:#9fb0aa; --line:#2a3b44;
  --accent:#2fae6a; --accent-ink:#06210f; --frame:#05090b; --finger:rgba(255,255,255,.92);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef2f0; --panel:#ffffff; --fg:#14201b; --muted:#5d6b65; --line:#d6ddd9;
    --accent:#1f7a4d; --accent-ink:#ffffff; --frame:#1b2420; --finger:rgba(20,32,27,.85);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 28px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:36px;height:36px;border-radius:9px}
header h1{font-size:20px;margin:0}
header p{margin:0;color:var(--muted);font-size:14px}
header .back{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none}
header .back:hover{border-color:var(--accent)}
.chaps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.chap{border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chap.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.dev{width:max-content;max-width:100%;margin:0 auto;background:var(--frame);border-radius:22px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.scr{position:relative;overflow:hidden;border-radius:10px;background:#fff}
.inner{position:absolute;left:0;top:0;width:1024px;height:720px;transform-origin:0 0}
iframe{border:0;width:1024px;height:720px;display:block;background:#fff}
.finger{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:var(--finger);box-shadow:0 2px 10px rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .3s,transform .15s}
.finger.on{opacity:.75}
.finger.tap{transform:scale(.7)}
.ring{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #2fae6a;pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2);opacity:0}}
/* Sous-titres par-dessus l'appli : en bas, ou en haut quand le doigt (ou un menu) est en bas */
.sub{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(90%,720px);z-index:4;
  background:rgba(8,14,18,.88);color:#fff;border-radius:16px;padding:12px 18px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .35s, top .45s, bottom .45s;pointer-events:none}
.sub.top{bottom:auto;top:5%}
.sub.off{opacity:0}
.sub small{display:block;color:#5fd395;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-bottom:3px}
.sub p{margin:0;font-size:clamp(15px,2.1vw,21px);line-height:1.4}
.bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:9px 16px;cursor:pointer}
.bar button.alt{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.prog{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(10,18,22,.78);color:#fff;text-align:center;padding:16px;z-index:5}
.start h2{margin:0;font-size:clamp(20px,3vw,28px)}
.start button{border:0;border-radius:999px;background:#2fae6a;color:#06210f;font:inherit;font-weight:700;font-size:clamp(16px,2.2vw,20px);padding:12px 26px;cursor:pointer}
.start .opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.start .opts button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);text-align:left;border-radius:14px;padding:10px 16px}
.start .opts button span{display:block;font-weight:400;font-size:13px;color:#cfe0d8}
.start p{margin:0;max-width:520px;color:#d8e4df;font-size:14px}
.start[hidden]{display:none}
.dev.phone{border-radius:30px;padding:12px}
.dev.phone .scr{border-radius:18px}
.dev.phone .start .opts{flex-direction:column}
.chap{font-weight:600}
.chap:hover{border-color:var(--accent)}
.chap[disabled],.bar button[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>Pick&amp;Stats en 3 minutes</h1><p>Démo animée de l’appli · données fictives</p></div>
    <a class="back" href="./">← Retour à l’appli</a>

  </div>
</div>

<script>
// Tablette à l'horizontale, ou téléphone en portrait sur un petit écran
const PHONE = matchMedia('(max-width: 700px)').matches;
const W = PHONE ? 390 : 1024, H = PHONE ? 740 : 720;
const $ = id => document.getElementById(id);
const frame = $('app'), finger = $('finger'), inner = $('inner'), scr = $('scr');
[inner, frame].forEach(el => { el.style.width = W + 'px'; el.style.height = H + 'px'; });
if (PHONE) scr.parentElement.classList.add('phone');

// --- Mise à l'échelle du cadre ---
function fit() {
  const w = document.querySelector('.wrap').clientWidth - 32 - 24;
  // Sur téléphone, on garde de la place sous le cadre pour les sous-titres
  const s = Math.min(1, w / W, PHONE ? (innerHeight - 200) / H : Math.max(0.45, (innerHeight - 200) / H));
  inner.style.transform = `scale(${s})`;
  scr.style.width = W * s + 'px';
  scr.style.height = H * s + 'px';
}
addEventListener('resize', fit);
fit();

// --- Lecture : pause, arrêt ---
let paused = false, run = 0, clock = 0; // clock : temps de lecture écoulé, hors pauses
const Stop = {};
async function sleep(ms) {
  const me = run;
  let t = 0;
  while (t < ms) {
    await new Promise(r => setTimeout(r, 50));
    if (me !== run) throw Stop;
    if (!paused) { t += 50; clock += 50; }
  }
}

// --- Appli dans le cadre ---
const doc = () => frame.contentDocument;
const q = sel => doc() && doc().querySelector(sel);
async function find(sel) {
  for (let i = 0; i < 60; i++) { const el = q(sel); if (el) return el; await sleep(100); }
  throw new Error('Introuvable : ' + sel);
}
let seed = null;
async function loadApp() {
  if (!seed) seed = $('seed').textContent;
  localStorage.setItem('bb-demo', seed);
  await new Promise(ok => { frame.onload = ok; frame.src = 'index.html?demo&t=' + Date.now(); });
  await sleep(600);
}

// Doigt : va sur l'élément, le touche (clic réel dans l'appli)
async function point(sel, opts = {}) {
  const el = typeof sel === 'string' ? await find(sel) : sel;
  el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  await sleep(450);
  const r = el.getBoundingClientRect();
  finger.classList.add('on');
  finger.style.left = r.left + r.width / 2 + 'px';
  finger.style.top = r.top + r.height / 2 + 'px';
  fingerY = r.top + r.height / 2;
  place();
  await sleep(opts.slow ? 1100 : 800);
  return el;
}
async function tap(sel, after = 700) {
  const el = await point(sel);
  finger.classList.add('tap');
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = finger.style.left; ring.style.top = finger.style.top;
  inner.appendChild(ring);
  setTimeout(() => ring.remove(), 700);
  await sleep(150);
  finger.classList.remove('tap');
  el.click();
  await sleep(after);
}
async function type(sel, text) {
  const el = await point(sel);
  el.focus({ preventScroll: true });
  el.value = '';
  for (const c of text) {
    el.value += c;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(90);
  }
  el.blur();
  await sleep(400);
}
async function scrollTo(sel) {
  const el = await find(sel);
  el.scrollIntoView({ block: 'start', behavior: 'smooth' });
  await sleep(900);
}
const hide = () => { finger.classList.remove('on'); fingerY = 0; };

// Sous-titre : reste affiché le temps de le lire
let total = 0, done = 0;
let fingerY = 0;
const sub = $('sub');
// Sous-titre en haut si le doigt est dans la moitié basse ou si la barre d'actions du joueur est ouverte
const place = () => sub.classList.toggle('top', fingerY > H * 0.5 || !!q('.bar .acts'));

// Une étape : [texte, temps de lecture en plus (ms), gestes].
// Le sous-titre s'affiche d'abord, les gestes se font pendant la lecture,
// puis on attend la fin de la lecture (et au moins un instant pour voir le résultat).
async function step([text, extra, act]) {
  const t0 = clock;
  place();
  sub.classList.remove('off');
  $('ctext').textContent = text;
  done++;
  $('prog').style.width = Math.min(100, 100 * done / total) + '%';
  await sleep(350);
  await act();
  place();
  const read = Math.max(2000, text.length * 52) + extra;
  await sleep(Math.max(900, read - (clock - t0)));
}

// --- Scénario ---
const CHAPTERS = [
  { title: 'À la table de marque', sub: 'Pour les bénévoles : saisir un match', steps: [
    ['Pick&Stats complète l’e-Marque : la feuille compte les points et les fautes, l’appli compte tout le reste. Interceptions, pertes de balle, rebonds, tirs ratés…', 0, async () => { hide(); }],
    ['Avant le coup d’envoi : « Commencer un match ».', -600, async () => { await tap('[data-x="startpick"]'); }],
    ['On choisit l’équipe qui joue…', -800, async () => { await tap('[data-x="pickteam"][data-id="t-sm1"]'); }],
    ['…on écrit le nom de l’adversaire et on choisit la couleur de son maillot.', 0, async () => { await type('[data-po]', 'BC des Pins'); await tap('[data-x="ocol"][data-v="#2563EB"]', 300); }],
    ['Les joueurs présents sont cochés, avec leur numéro pour ce match. Un absent ? On le décoche.', 0, async () => { await tap('[data-pc="9"]', 300); }],
    ['C’est parti ! Un bouton par joueur, avec son numéro et son prénom. En haut : les deux équipes, aux couleurs de leurs maillots.', 400, async () => { await tap('[data-x="pstart"]'); hide(); }],
    ['On touche le joueur…', -1000, async () => { await tap('[data-x="pl"][data-p="9"]', 400); }],
    ['…puis l’action : interception pour le n° 9.', 0, async () => { await tap('[data-x="act"][data-a="stl"]'); }],
    ['Un tir raté ? L’appli demande tout de suite qui a pris le rebond, aux couleurs des équipes.', 0, async () => { await tap('[data-x="pl"][data-p="5"]', 300); await tap('[data-x="act"][data-a="m2"]', 600); }],
    ['Rebond défensif pour l’adversaire : c’est noté.', -500, async () => { await tap('#modal [data-i="1"]'); }],
    ['Rebonds et ballons gagnés d’équipe : un seul toucher sur les boutons du haut.', 0, async () => { await tap('[data-x="tact"][data-a="rd"]'); }],
    ['Balle perdue pour le n° 6… et les pastilles sous chaque joueur montrent ses stats du quart-temps.', 0, async () => { await tap('[data-x="pl"][data-p="6"]', 300); await tap('[data-x="act"][data-a="to"]'); }],
    ['Une erreur ? « Annuler la dernière » efface l’action précédente. L’historique permet aussi de corriger plus tard.', 0, async () => { await tap('[data-x="undo"]'); }],
    ['Fin du quart-temps : on passe au suivant avec la flèche.', -400, async () => { await tap('[data-x="q+"]'); }],
    ['L’onglet Statistiques donne le tableau en direct, par quart-temps ou pour tout le match. Pratique pour le coach pendant les temps morts.', 400, async () => { await tap('nav [data-v="stats"]'); hide(); }],
    ['Au coup de sifflet final : « Archiver ». Le match rejoint les matchs archivés, et avec un club en ligne il est partagé avec les coachs.', 0, async () => { await tap('nav .homebtn'); await tap('[data-x="harchive"]', 600); await tap('[data-x="myes"]'); hide(); }],
  ] },
  { title: 'Pour les coachs', sub: 'Équipes, feuille e-Marque, rapport', steps: [
    ['« Effectifs et matchs » : les équipes du club et tous les matchs.', -400, async () => { hide(); await tap('[data-x="view"][data-v="club"]'); }],
    ['Chaque équipe a sa catégorie, sa couleur et ses joueurs, avec leur numéro habituel.', 0, async () => { await tap('[data-x="tedit"][data-id="t-sm1"]'); }],
    ['Nouveau : on crée une équipe directement depuis la feuille e-Marque d’un match. Joueurs, numéros et catégorie sont repris tout seuls.', 300, async () => { await tap('[data-x="tback"]', 500); await point('[data-x="tempick"]', { slow: true }); }],
    ['Les matchs archivés, avec le score quand la feuille e-Marque a été importée.', -300, async () => { await tap('[data-x="view"][data-v="games"]'); hide(); }],
    ['La fiche du match : chaque chiffre de l’équipe est comparé à sa moyenne de la saison, en vert quand c’est mieux. Exports et envoi sont dans « Gérer le match ».', 600, async () => { await tap('[data-x="gopen"][data-id="1730000000000"]'); hide(); }],
    ['L’onglet Joueurs : la feuille e-Marque et les actions saisies, joueur par joueur.', 0, async () => { await tap('[data-x="gtab"][data-v="players"]'); hide(); }],
    ['On y importe les PDF de l’e-Marque. Points, tirs, lancers francs, fautes, temps de jeu et score de chaque quart-temps sont lus automatiquement.', 300, async () => { await point('[data-x="rpopen"]', { slow: true }); }],
    ['Et on obtient un rapport complet du match. Les commentaires s’adaptent au résultat et aux chiffres.', 600, async () => { await tap('[data-x="rpopen"]'); hide(); }],
    ['Le match quart-temps par quart-temps…', -300, async () => { await tap('[data-x="rp"][data-v="quarts"]'); hide(); }],
    ['…l’adresse de chaque joueur…', -500, async () => { await tap('[data-x="rp"][data-v="joueurs"]'); hide(); }],
    ['…et l’équipe face à l’adversaire : tirs, rebonds, ballons. Le rapport se télécharge aussi en fichier à partager.', 0, async () => { await tap('[data-x="rp"][data-v="equipe"]'); hide(); }],
    ['Pick&Stats : une saisie simple pour les bénévoles, une analyse poussée pour les coachs. Bon match !', 800, async () => { hide(); }],
  ] },
];

// --- Lecture ---
const chips = $('chaps');
// Chapitres : pastilles au-dessus du cadre et boutons de l'écran de départ (un chapitre seul)
CHAPTERS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'chap'; b.textContent = `${i + 1}. ${c.title}`;
  b.onclick = () => play(i, true);
  chips.appendChild(b);
  const o = document.createElement('button');
  o.innerHTML = `${i + 1}. ${c.title}<span>${c.sub}</span>`;
  o.onclick = () => play(i, true);
  $('opts').appendChild(o);
});
const mark = i => [...chips.children].forEach((b, k) => b.classList.toggle('on', k === i));

let last = { from: 0, only: false };
async function play(from = 0, only = false) {
  const me = ++run;
  last = { from, only };
  const to = only ? from : CHAPTERS.length - 1;
  paused = false; $('pp').textContent = '❚❚ Pause';
  $('start').hidden = true;
  total = CHAPTERS.slice(from, to + 1).reduce((a, c) => a + c.steps.length, 0); done = 0;
  $('prog').style.width = '0';
  hide();
  mark(from);
  try {
    $('ctitle').textContent = CHAPTERS[from].title;
    $('ctext').textContent = 'Préparation de la démo…';
    sub.classList.remove('top', 'off');
    await loadApp();
    for (let i = from; i <= to; i++) {
      mark(i);
      $('ctitle').textContent = CHAPTERS[i].title;
      if (i > from) await loadApp(); // chaque chapitre repart des données de démo
      for (const s of CHAPTERS[i].steps) { if (me !== run) return; await step(s); }
    }
    hide();
    sub.classList.add('off');
    mark(-1);
    $('stitle').textContent = only ? `Fin du chapitre ${from + 1}` : 'Fin de la démo';
    $('go').textContent = only ? '↺ Revoir ce chapitre' : '↺ Revoir la démo';
    $('snote').textContent = 'Choisis un chapitre pour le revoir seul.';
    $('start').hidden = false;
  } catch (e) {
    if (e !== Stop) { console.error(e); $('ctext').textContent = 'La démo s’est interrompue. Appuie sur « Recommencer ».'; }
  }
}
// Ouverte comme un fichier (double-clic) : le navigateur refuse de lancer l'appli dans le cadre.
if (!/^https?:$/.test(location.protocol)) {
  $('go').hidden = true;
  $('start').querySelector('p').innerHTML = 'La démo doit être ouverte depuis une adresse web, pas comme un fichier.<br>'
    + 'Ouvre <b>https://slunox.github.io/stats-basket/demo.html</b>, ou les Réglages de l’appli › « Voir la démo animée ».';
  $('opts').hidden = true;
  document.querySelectorAll('.chap, .bar button').forEach(b => { b.disabled = true; });
} else loadApp().catch(() => {}); // l'accueil de l'appli derrière le bouton de lancement
$('go').onclick = () => play(last.from, last.only);
$('again').onclick = () => play(last.from, last.only);
$('pp').onclick = () => { paused = !paused; $('pp').textContent = paused ? '▶ Reprendre' : '❚❚ Pause'; };
</script>
</body>
</html>
