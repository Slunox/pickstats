<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick&amp;Stats – démo</title>
<link rel="icon" href="icon.svg">
<style>
/* Démo qui se joue toute seule : la vraie appli (index.html?demo, données à part) dans un cadre
   de tablette, un doigt qui touche les boutons et des sous-titres. */
:root{
  --bg:#0f1a20; --panel:#16242c; --fg:#eef3f1; --muted:#9fb0aa; --line:#2a3b44;
  --accent:#2fae6a; --accent-ink:#06210f; --frame:#05090b; --finger:rgba(255,255,255,.92);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef2f0; --panel:#ffffff; --fg:#14201b; --muted:#5d6b65; --line:#d6ddd9;
    --accent:#1f7a4d; --accent-ink:#ffffff; --frame:#1b2420; --finger:rgba(20,32,27,.85);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px 16px 28px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
header img{width:36px;height:36px;border-radius:9px}
header h1{font-size:20px;margin:0}
header p{margin:0;color:var(--muted);font-size:14px}
header .back{margin-left:auto;flex:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;text-decoration:none}
header .back:hover{border-color:var(--accent)}
@media (max-width:700px){header p{display:none}header h1{font-size:17px}header .back{padding:7px 10px}.wrap{padding-top:10px;padding-bottom:12px}}
.dev{width:max-content;max-width:100%;margin:0 auto;background:var(--frame);border-radius:22px;padding:14px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.scr{position:relative;overflow:hidden;border-radius:10px;background:#fff}
.inner{position:absolute;left:0;top:0;width:1024px;height:720px;transform-origin:0 0}
iframe{border:0;width:1024px;height:720px;display:block;background:#fff}
/* Voile transparent sur l'appli : on regarde la démo, on ne peut pas toucher l'appli (le doigt de la démo, lui, clique) */
.shield{position:absolute;inset:0;z-index:1}
.finger{z-index:2;position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;
  background:var(--finger);box-shadow:0 2px 10px rgba(0,0,0,.35);opacity:0;pointer-events:none;
  transition:left .7s cubic-bezier(.4,0,.2,1),top .7s cubic-bezier(.4,0,.2,1),opacity .3s,transform .15s}
.finger.on{opacity:.75}
.finger.tap{transform:scale(.7)}
.ring{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid #2fae6a;pointer-events:none;animation:ring .6s ease-out forwards}
@keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(2);opacity:0}}
/* Sous-titres par-dessus l'appli : en bas, ou en haut quand le doigt (ou un menu) est en bas */
.sub{position:absolute;left:50%;top:0;transform:translateX(-50%);width:min(90%,720px);z-index:4;
  background:rgba(8,14,18,.88);color:#fff;border-radius:16px;padding:12px 18px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .35s, top .7s cubic-bezier(.65,0,.35,1);pointer-events:none}
.sub.off{opacity:0}
.sub small{display:block;color:#5fd395;font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:12px;margin-bottom:3px}
.sub p{margin:0;font-size:clamp(15px,2.1vw,21px);line-height:1.4}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px}
.bar button{border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:9px 16px;cursor:pointer}
.bar button.alt{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
/* Barre de progression cliquable : zone haute pour le doigt, piste fine au milieu, repères de chapitres */
.prog{flex:1 1 200px;min-width:200px;height:24px;position:relative;cursor:pointer;touch-action:manipulation}
.prog::before,.prog i{content:'';position:absolute;left:0;top:9px;height:6px;border-radius:3px;transition:height .15s,top .15s}
.prog::before{right:0;background:var(--line)}
.prog i{width:0;background:var(--accent);transition:width .4s,height .15s,top .15s}
.prog:hover::before,.prog:hover i{top:7px;height:10px;border-radius:5px}
/* Pas assez de place à côté des boutons (téléphone) : la barre passe au-dessus, sur toute la largeur, plus épaisse */
@media (max-width:700px){
  .prog{order:-1;flex-basis:100%;height:32px}
  .prog::before,.prog i,.prog:hover::before,.prog:hover i{top:11px;height:10px;border-radius:5px}
  .bar button{flex:1;padding:9px 8px;font-size:14px;white-space:nowrap}
  /* Sous-titres plus petits : le cadre est réduit */
  .dev.phone .sub{padding:8px 12px 10px;border-radius:12px;width:94%}
  .dev.phone .sub p{font-size:14px;line-height:1.35}
  .dev.phone .sub small{font-size:10px;margin-bottom:1px}
}
.prog b{position:absolute;top:5px;width:2px;height:14px;margin-left:-1px;border-radius:1px;background:var(--muted);pointer-events:none}
@media (max-width:700px){.prog b{top:8px;height:16px}}
.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:rgba(10,18,22,.78);color:#fff;text-align:center;padding:16px;z-index:5}
.start h2{margin:0;font-size:clamp(20px,3vw,28px)}
.start button{border:0;border-radius:999px;background:#2fae6a;color:#06210f;font:inherit;font-weight:700;font-size:clamp(16px,2.2vw,20px);padding:12px 26px;cursor:pointer}
.start .opts{display:grid;grid-template-columns:repeat(3,minmax(0,250px));gap:10px;justify-content:center}
.start .opts button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);text-align:left;border-radius:14px;padding:10px 16px}
.start .opts button span{display:block;font-weight:400;font-size:13px;color:#cfe0d8}
.start p{margin:0;max-width:520px;color:#d8e4df;font-size:14px}
.start[hidden]{display:none}
.dev.phone{border-radius:30px;padding:12px}
.dev.phone .scr{border-radius:18px}
.dev.phone .start .opts{grid-template-columns:minmax(0,300px)}
/* Petit cadre : choix des chapitres plus compact */
.dev.small .start{gap:8px}
.dev.small .start h2{font-size:18px}
.dev.small .start button{font-size:15px;padding:8px 18px}
.dev.small .start .opts{gap:6px}
.dev.small .start .opts button{padding:7px 12px;font-size:13px;border-radius:10px}
.dev.small .start .opts button span{display:none}
.bar button[disabled]{opacity:.5;cursor:default}
</style>
</head>

<div class="wrap">
  <header>
    <img src="icon-192.png" alt="">
    <div><h1>Pick&amp;Stats en 6 minutes</h1><p>Démo animée de l’appli · données fictives</p></div>
    <a class="back" href="./">← Retour à l’appli</a>

  <div class="dev"><div class="scr" id="scr">

      <button id="go">▶ Tout voir (6 min)</button>

    <button class="alt" id="again">↺ Recommencer</button>
    <div class="prog" id="track" title="Aller à ce moment de la démo"><i id="prog"></i></div>
  </div>
</div>

<script>
// Tablette à l'horizontale, ou téléphone en portrait sur un petit écran
const PHONE = matchMedia('(max-width: 700px)').matches;
const W = PHONE ? 390 : 1024, H = PHONE ? 740 : 720;
const $ = id => document.getElementById(id);
const frame = $('app'), finger = $('finger'), inner = $('inner'), scr = $('scr');
[inner, frame].forEach(el => { el.style.width = W + 'px'; el.style.height = H + 'px'; });
if (PHONE) scr.parentElement.classList.add('phone');

// --- Mise à l'échelle du cadre ---
function fit() {
  const w = document.querySelector('.wrap').clientWidth - 32 - 24;
  // Hauteur laissée au cadre : l'écran moins l'en-tête, la barre du bas (boutons et progression) et les marges,
  // pour que tout tienne sans faire défiler la page, même sur un petit téléphone
  const around = document.querySelector('.wrap').offsetHeight - scr.offsetHeight + 4;
  const s = Math.min(1, w / W, PHONE ? (innerHeight - around) / H : Math.max(0.45, (innerHeight - around) / H));
  inner.style.transform = `scale(${s})`;
  scr.style.width = W * s + 'px';
  scr.style.height = H * s + 'px';
  scr.parentElement.classList.toggle('small', H * s < 480);
}
addEventListener('resize', fit);
fit();

// --- Lecture : pause, arrêt ---
let paused = false, run = 0, clock = 0; // clock : temps de lecture écoulé, hors pauses
let fast = false; // avance rapide (clic sur la barre) : les étapes d'avant sont rejouées sans attendre
const Stop = {};
async function sleep(ms) {
  const me = run;
  if (fast) { await new Promise(r => setTimeout(r, 20)); if (me !== run) throw Stop; return; }
  let t = 0;
  while (t < ms) {
    await new Promise(r => setTimeout(r, 50));
    if (me !== run) throw Stop;
    if (!paused) { t += 50; clock += 50; }
  }
}

// --- Appli dans le cadre ---
const doc = () => frame.contentDocument;
const q = sel => doc() && doc().querySelector(sel);
async function find(sel) {
  const t0 = Date.now();
  while (Date.now() - t0 < 6000) { const el = q(sel); if (el) return el; await sleep(100); }
  throw new Error('Introuvable : ' + sel);
}
let seed = null;
async function loadApp(ch) {
  if (!seed) seed = $('seed').textContent;
  const s = JSON.parse(seed);
  // prep peut renvoyer une feuille e-Marque fictive, que l'appli « lit » au lieu d'un PDF
  const sheet = ch && ch.prep ? ch.prep(s) : null;
  if (sheet) localStorage.setItem('bb-demo-em', JSON.stringify(sheet)); else localStorage.removeItem('bb-demo-em');
  localStorage.setItem('bb-demo', JSON.stringify(s));
  // Compte et club simulés du chapitre (aucun : pas connecté)
  if (ch && ch.cloud) localStorage.setItem('bb-demo-cloud', JSON.stringify(ch.cloud)); else localStorage.removeItem('bb-demo-cloud');
  await new Promise(ok => { frame.onload = ok; frame.src = 'index.html?demo&t=' + Date.now(); });
  await sleep(600);
}

// Fait défiler l'appli jusqu'à l'élément (au centre, ou en haut), sans toucher à la page autour du cadre
// (scrollIntoView ferait aussi défiler la page de la démo).
function scrollIn(el, block) {
  const win = frame.contentWindow, d = doc();
  let box = el.parentElement;
  while (box && box !== d.body && box !== d.documentElement) {
    const st = win.getComputedStyle(box);
    if (/(auto|scroll)/.test(st.overflowY) && box.scrollHeight > box.clientHeight) break;
    box = box.parentElement;
  }
  const inner = box && box !== d.body && box !== d.documentElement;
  const r = el.getBoundingClientRect(), view = inner ? box.getBoundingClientRect() : { top: 0, height: win.innerHeight };
  const off = r.top - view.top - (block === 'center' ? (view.height - r.height) / 2 : 8);
  (inner ? box : win).scrollBy({ top: off, behavior: fast ? 'instant' : 'smooth' });
}

// Doigt : va sur l'élément, le touche (clic réel dans l'appli)
async function point(sel, opts = {}) {
  const el = typeof sel === 'string' ? await find(sel) : sel;
  scrollIn(el, 'center');
  await sleep(450);
  const r = el.getBoundingClientRect();
  finger.classList.add('on');
  finger.style.left = r.left + r.width / 2 + 'px';
  finger.style.top = r.top + r.height / 2 + 'px';
  fingerY = r.top + r.height / 2;
  place();
  await sleep(opts.slow ? 1100 : 800);
  return el;
}
async function tap(sel, after = 700) {
  const el = await point(sel);
  finger.classList.add('tap');
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = finger.style.left; ring.style.top = finger.style.top;
  inner.appendChild(ring);
  setTimeout(() => ring.remove(), 700);
  await sleep(150);
  finger.classList.remove('tap');
  el.click();
  await sleep(after);
}
async function type(sel, text) {
  const el = await point(sel);
  el.focus({ preventScroll: true });
  el.value = '';
  for (const c of text) {
    el.value += c;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    await sleep(90);
  }
  el.blur();
  await sleep(400);
}
async function scrollTo(sel) {
  const el = await find(sel);
  scrollIn(el, 'start');
  await sleep(900);
}
const hide = () => { finger.classList.remove('on'); fingerY = 0; };

// Sous-titre : reste affiché le temps de le lire
let total = 0, done = 0;
let fingerY = 0;
const sub = $('sub');
// Sous-titre en bas, ou en haut. Il ne change de côté que si le doigt passe dessous (ou si la barre
// d'actions du joueur s'ouvre en bas), et glisse alors jusqu'à sa nouvelle place.
let side = 'bottom';
function place() {
  const h = scr.clientHeight, sh = sub.offsetHeight, gap = h * 0.05, k = h / H;
  const at = sd => (sd === 'top' ? gap : h - gap - sh);
  if (q('.bar .acts')) side = 'top';
  else if (fingerY) {
    const fy = fingerY * k, y = at(side);
    if (fy > y - 40 && fy < y + sh + 40) side = side === 'top' ? 'bottom' : 'top';
  }
  // Même côté (texte plus ou moins long) : pas de glissement, le bord reste fixe
  const slide = side !== sub.dataset.side;
  sub.dataset.side = side;
  if (!slide) sub.style.transition = 'opacity .35s';
  sub.style.top = at(side) + 'px';
  if (!slide) { void sub.offsetHeight; sub.style.transition = ''; }
}
addEventListener('resize', place);

// Une étape : [texte, temps de lecture en plus (ms), gestes].
// Le sous-titre s'affiche d'abord, les gestes se font pendant la lecture,
// puis on attend la fin de la lecture (et au moins un instant pour voir le résultat).
async function step([text, extra, act], quick) {
  if (quick) { // avance rapide : les gestes seulement, pour mettre l'appli dans le bon état
    $('ctext').textContent = 'Avance rapide…';
    fast = true;
    try { await act(); } finally { fast = false; }
    done++;
    return;
  }
  const t0 = clock;
  $('ctext').textContent = text;
  place();
  sub.classList.remove('off');
  done++;
  $('prog').style.width = Math.min(100, 100 * done / total) + '%';
  await sleep(350);
  await act();
  place();
  const read = Math.max(2000, text.length * 52) + extra;
  await sleep(Math.max(900, read - (clock - t0)));
}

// --- Scénario ---
// Liste déroulante : le doigt va dessus, puis la valeur change (comme un choix dans la liste)
async function pick(sel, value) {
  const el = await point(sel);
  el.value = value;
  el.dispatchEvent(new Event('change', { bubbles: true }));
  await sleep(700);
}

// --- Lecture ---
// Chapitres : boutons de l'écran de départ (un chapitre seul)
CHAPTERS.forEach((c, i) => {
  const o = document.createElement('button');
  o.innerHTML = `${i + 1}. ${c.title}<span>${c.sub}</span>`;
  o.onclick = () => play(i, true);
  $('opts').appendChild(o);
});
// Pause et Arrêter : seulement pendant la lecture
const playing = on => { $('pp').disabled = $('stop').disabled = !on; };

let last = { from: 0, only: false };
async function play(from = 0, only = false, at = 0) {
  const me = ++run;
  last = { from, only };
  const to = only ? from : CHAPTERS.length - 1;
  paused = false; $('pp').textContent = '❚❚ Pause';
  $('start').hidden = true;
  total = CHAPTERS.slice(from, to + 1).reduce((a, c) => a + c.steps.length, 0);
  // Chapitre de l'étape demandée : les chapitres d'avant sont sautés (chacun repart de zéro)
  let first = from, gi = 0;
  while (first < to && gi + CHAPTERS[first].steps.length <= at) gi += CHAPTERS[first++].steps.length;
  done = gi;
  $('prog').style.width = 100 * at / total + '%';
  ticks(from, to);
  hide();
  playing(true);
  try {
    $('ctitle').textContent = `${first + 1}. ${CHAPTERS[first].title}`;
    $('ctext').textContent = 'Préparation de la démo…';
    side = 'bottom'; place();
    sub.classList.remove('off');
    await loadApp(CHAPTERS[first]);
    for (let i = first; i <= to; i++) {
      $('ctitle').textContent = `${i + 1}. ${CHAPTERS[i].title}`;
      if (i > first) await loadApp(CHAPTERS[i]); // chaque chapitre repart des données de démo (et de son compte)
      for (const s of CHAPTERS[i].steps) { if (me !== run) return; await step(s, gi++ < at); }
    }
    hide();
    sub.classList.add('off');
    playing(false);
    $('stitle').textContent = only ? `Fin du chapitre ${from + 1}` : 'Fin de la démo';
    $('go').textContent = only ? '↺ Revoir ce chapitre' : '↺ Revoir la démo';
    $('start').hidden = false;
  } catch (e) {
    if (e !== Stop) { console.error(e); $('ctext').textContent = 'La démo s’est interrompue. Appuie sur « Recommencer ».'; }
  }
}
// Ouverte comme un fichier (double-clic) : le navigateur refuse de lancer l'appli dans le cadre.
if (!/^https?:$/.test(location.protocol)) {
  $('go').hidden = true;
  const note = document.createElement('p'); $('start').appendChild(note);
  note.innerHTML = 'La démo doit être ouverte depuis une adresse web, pas comme un fichier.<br>'
    + 'Ouvre <b>https://slunox.github.io/pickstats/demo.html</b>, ou les Réglages de l’appli › « Voir la démo animée ».';
  $('opts').hidden = true;
  document.querySelectorAll('.bar button').forEach(b => { b.disabled = true; });
} else loadApp().catch(() => {}); // l'accueil de l'appli derrière le bouton de lancement
$('go').onclick = () => play(last.from, last.only);
$('again').onclick = () => play(last.from, last.only);
// Repères des débuts de chapitres sur la barre (quand on regarde tout)
function ticks(from, to) {
  const track = $('track'), n = CHAPTERS.slice(from, to + 1).reduce((a, c) => a + c.steps.length, 0);
  track.querySelectorAll('b').forEach(b => b.remove());
  let k = 0;
  for (let i = from; i < to; i++) {
    k += CHAPTERS[i].steps.length;
    const b = document.createElement('b'); b.style.left = 100 * k / n + '%'; track.appendChild(b);
  }
}
ticks(0, CHAPTERS.length - 1);
// Clic sur la barre : la démo reprend à cette étape
$('track').onclick = e => {
  if ($('go').hidden) return; // ouverte comme un fichier : pas de lecture possible
  const r = e.currentTarget.getBoundingClientRect();
  const to = last.only ? last.from : CHAPTERS.length - 1;
  const n = CHAPTERS.slice(last.from, to + 1).reduce((a, c) => a + c.steps.length, 0);
  const at = Math.max(0, Math.min(n - 1, Math.floor((e.clientX - r.left) / r.width * n)));
  play(last.from, last.only, at);
};
// Arrêter : retour à l'écran de départ, pour choisir un autre chapitre
$('stop').onclick = () => {
  run++;
  hide();
  sub.classList.add('off');
  playing(false);
  $('prog').style.width = '0';
  last = { from: 0, only: false };
  $('stitle').textContent = 'La démo de Pick&Stats';
  $('go').textContent = '▶ Tout voir (6 min)';
  $('start').hidden = false;
};
$('pp').onclick = () => { paused = !paused; $('pp').textContent = paused ? '▶ Reprendre' : '❚❚ Pause'; };
