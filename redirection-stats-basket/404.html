<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick&amp;Stats a déménagé</title>
<!-- Ancienne adresse de l'appli (slunox.github.io/stats-basket/) : renvoie vers la nouvelle,
     en gardant la suite de l'adresse (page, ?demo, #m=… des matchs partagés). -->
<script>
  (function () {
    var p = location.pathname;
    if (p.indexOf('/stats-basket') !== 0) return; // pas sur l'ancienne adresse : on ne fait rien
    location.replace(location.origin + '/pickstats' + p.slice('/stats-basket'.length) + location.search + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="3;url=https://slunox.github.io/pickstats/">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d1f17;color:#e8f2ec;
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:16px;box-sizing:border-box}
  a{color:#5fd395;font-weight:600}
</style>
</head>
<body>
  <p>Pick&amp;Stats a changé d’adresse :<br><a href="https://slunox.github.io/pickstats/">slunox.github.io/pickstats</a></p>
</body>
</html>
