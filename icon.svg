<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Icône de Pick&amp;Stats : couleurs de l’E.S. Blanquefort (vert), ballon et barres de stats.
       Tout le dessin tient dans la zone sûre centrale (80 %) pour les icônes « maskable ». -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#3F9A4B"/>
      <stop offset=".55" stop-color="#226B32"/>
      <stop offset="1" stop-color="#0F3B1C"/>
    </radialGradient>
    <radialGradient id="ball" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#FF9A3D"/>
      <stop offset=".6" stop-color="#EE6A17"/>
      <stop offset="1" stop-color="#C24E0C"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDEFD8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#04200C" flood-opacity=".45"/>
    </filter>
    <clipPath id="ballclip"><circle cx="312" cy="206" r="118"/></clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(.86) translate(-262 -252)">

  <!-- Ballon -->
  <g filter="url(#sh)">
    <circle cx="312" cy="206" r="118" fill="url(#ball)"/>
    <g clip-path="url(#ballclip)" stroke="#123F1E" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M194 206 H430"/>
      <path d="M312 88 V324"/>
      <path d="M232 112 C282 160 282 252 232 300"/>
      <path d="M392 112 C342 160 342 252 392 300"/>
    </g>
  </g>

  <!-- Barres de stats -->
  <g filter="url(#sh)" fill="url(#bar)">
    <rect x="104" y="330" width="58" height="82" rx="16"/>
    <rect x="182" y="300" width="58" height="112" rx="16"/>
    <rect x="260" y="270" width="58" height="142" rx="16"/>
    <rect x="338" y="232" width="58" height="180" rx="16"/>
  </g>
  <rect x="96" y="420" width="308" height="10" rx="5" fill="#FFFFFF" fill-opacity=".35"/>
  </g>
</svg>
